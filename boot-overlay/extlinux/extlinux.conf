# U-Boot "distro boot" config for the RK3229 (MX10).
# The partition is plain FAT32 (label RK3229BOOT): edit this file from any PC.
default alpine
menu title RK3229 boot
timeout 50

label alpine
  menu label Alpine Linux (HDMI + serial)
  linux /zImage
  fdt /rk3229-mx10.dtb
  append console=tty1 console=ttyS2,1500000n8 loglevel=4 root=PARTUUID=52334b32-02 rootfstype=ext4 rootwait rw

# Verbose boot log for debugging over the serial console.
label debug
  menu label Alpine Linux (debug: earlycon, verbose)
  linux /zImage
  fdt /rk3229-mx10.dtb
  append console=ttyS2,1500000n8 earlycon=uart8250,mmio32,0x11030000 ignore_loglevel loglevel=8 root=PARTUUID=52334b32-02 rootfstype=ext4 rootwait rw

# Keep firmware-enabled clocks / power domains on (rules out late_initcall hangs).
label alpine-safe
  menu label Alpine Linux (clk_ignore_unused pd_ignore_unused)
  linux /zImage
  fdt /rk3229-mx10.dtb
  append console=tty1 console=ttyS2,1500000n8 loglevel=4 clk_ignore_unused pd_ignore_unused root=PARTUUID=52334b32-02 rootfstype=ext4 rootwait rw
